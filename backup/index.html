<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HAS Lucky Draw</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101820;
        color: #f7f4e9;
        font-family: Verdana, sans-serif;
      }
      main {
        width: min(90%, 640px);
        text-align: center;
      }
      h1 {
        color: #e2cf8e;
      }
      nav {
        display: grid;
        gap: 16px;
        margin-top: 32px;
      }
      a {
        display: block;
        padding: 18px;
        background: #263746;
        color: #fff;
        text-decoration: none;
        border: 1px solid #e2cf8e;
      }
      a:hover {
        background: #345064;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HAS Lucky Draw</h1>
      <nav aria-label="Lucky draw sets">
        <a href="./16th-100th/">16th-100th Draw</a>
        <a href="./1st-15th/raffle-master/">1st-15th Draw</a>
      </nav>
    </main>
  </body>
</html>
