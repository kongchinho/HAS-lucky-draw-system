
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      var win = null
    </script>
    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
      }
      body {
        text-align: center;
        background: url("./bg.jpg") no-repeat;
        overflow: hidden;
        background-size: 100% 100%;
	font-family: Verdana Pro, sans-serif;
        font-weight: bold;
        color: #faf9f5;
      }
      #container {
        max-width: 80%;
    	max-height: 100%;
	margin-left: auto;
	margin-right: auto;
      }
      #title {
        font-size: 300px;
		color: #e2cf8e;
        margin-top: 250px;
      }
      #disc {
        font-size: 50px;
		color: #faf9f5;
        margin: 40px 0;
      }
      #image {
        margin-top: auto;
	margin-bottom: auto;
        max-height: 280px;
        border: 0px solid #E23540FF;
	max-width: 100%;
        border-radius: 0px;
      }
      #list {
	margin: 0px auto;
        max-width: 100%;
      }
      #list span {
        display: inline-block;
        width: 1920px;
        font-size: 70px;
        margin-top: 80px;
   	max-width: 100%;
    	max-height: 100%;
	margin-left: auto;
	margin-right: auto;
	color: #ffffff;
	text-shadow: 10px 10px 10px #000000;
      }
      #export {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 56px;
        height: 56px;
        border: 0;
        border-radius: 50%;
        background: #e2cf8e;
        color: #242424;
        font-size: 28px;
        line-height: 56px;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
      }
      #export:hover {
        background: #f5e8b3;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <div id="title">   </div>
      <div id="disc">獎品描述</div>
      <img id="image" />
      <div id="list"></div>
    </div>
    <button id="export" type="button" title="Staff remaining: loading" aria-label="Export winners to Excel">⇩</button>
    <script>
      var steps = null
      var step = 0
      var names = null
      var state = ''
      var originalNames = null
      var originalSteps = null
      var savedStateKey = 'has-lucky-draw-state:' + location.pathname
      var fileSystem = null
      if (typeof require === 'function') {
        var fileSystemModule = require('fs')
        var pathModule = require('path')
        var applicationPath = null
        var candidates = []
        if (typeof process !== 'undefined' && process.cwd) {
          candidates.push(process.cwd())
        }
        candidates.push(pathModule.dirname(decodeURIComponent(location.pathname)
          .replace(/^\/([A-Za-z]:)/, '$1')))
        if (typeof nw !== 'undefined' && nw.App) {
          candidates.push(nw.App.startPath)
        }
        for (var i = 0; i < candidates.length; ++i) {
          if (fileSystemModule.existsSync(pathModule.join(candidates[i], 'steps.json'))) {
            applicationPath = candidates[i]
            break
          }
        }
        if (applicationPath) {
          fileSystem = {
            fs: fileSystemModule,
            path: pathModule,
            basePath: applicationPath
          }
        }
      }
      
      var disc = document.getElementById('disc')
      var image = document.getElementById('image')
      var list = document.getElementById('list')
      var exportButton = document.getElementById('export')

      function updateExportTooltip() {
        exportButton.title = names
          ? 'Staff remaining: ' + names.length
          : 'Staff remaining: loading'
      }

      function parseNames(data) {
        return data.split('\n').filter(function(line) {
          return line.trim() !== ''
        }).map(function(x) {
          return x.split(',')
        })
      }

      function ensureOriginalFiles() {
        if (!fileSystem) {
          return
        }
        var files = ['steps.json', 'names.ini']
        for (var i = 0; i < files.length; ++i) {
          var source = fileSystem.path.join(fileSystem.basePath, files[i])
          var backup = source + '.orig'
          if (!fileSystem.fs.existsSync(backup)) {
            fileSystem.fs.copyFileSync(source, backup)
          }
        }
      }

      function loadOriginalFiles() {
        if (!fileSystem) {
          return
        }
        var stepsPath = fileSystem.path.join(fileSystem.basePath, 'steps.json.orig')
        var namesPath = fileSystem.path.join(fileSystem.basePath, 'names.ini.orig')
        originalSteps = JSON.parse(fileSystem.fs.readFileSync(stepsPath, 'utf8'))
        originalNames = parseNames(fileSystem.fs.readFileSync(namesPath, 'utf8'))
      }

      function reloadConf(func) {
        Promise.all([
          fetch('./names.ini').then(function(response) {
            if (!response.ok) throw new Error('Unable to load names.ini')
            return response.text()
          }),
          fetch('./steps.json').then(function(response) {
            if (!response.ok) throw new Error('Unable to load steps.json')
            return response.json()
          })
        ]).then(function(data) {
          names = parseNames(data[0])
          steps = data[1]
          originalNames = names.map(function(name) { return name.slice() })
          originalSteps = JSON.parse(JSON.stringify(steps))
          loadOriginalFiles()
          var savedState = fileSystem ? null : localStorage.getItem(savedStateKey)
          if (savedState) {
            var saved = JSON.parse(savedState)
            names = saved.names
            steps = saved.steps
          }
          updateExportTooltip()
          if (func) func()
        }).catch(function(err) {
          alert(err.message + '. Check that the site is being served over HTTP.')
        })
      }

      function saveConf(func) {
        if (fileSystem) {
          try {
            fileSystem.fs.writeFileSync(
              fileSystem.path.join(fileSystem.basePath, 'steps.json'),
              JSON.stringify(steps, null, 2) + '\n'
            )
            fileSystem.fs.writeFileSync(
              fileSystem.path.join(fileSystem.basePath, 'names.ini'),
              names.map(function(name) { return name.join(',') }).join('\n') + '\n'
            )
          } catch (err) {
            alert('Unable to save draw data: ' + err.message)
            return
          }
        }
        localStorage.setItem(savedStateKey, JSON.stringify({
          names: names,
          steps: steps
        }))
        if (func) func()
      }

      function csvCell(value) {
        return '"' + String(value == null ? '' : value).replace(/"/g, '""') + '"'
      }

      function exportWinners() {
        if (!steps) {
          alert('抽獎資料尚未載入')
          return
        }
        var rows = [['Prize(1-15)', 'disc', 'Winner name', 'Section']]
        for (var i = 0; i < steps.length; ++i) {
          var data = steps[i]
          var winners = currentWinners(data)
          for (var j = 0; j < winners.length; ++j) {
            var winner = Array.isArray(winners[j]) ? winners[j][0] : winners[j]
            var parts = String(winner).trim().split(/\s+/)
            var section = parts.shift() || ''
            parts.shift()
            rows.push([steps.length - i, data.disc, parts.join(' '), section])
          }
        }
        if (rows.length === 1) {
          alert('目前沒有中獎紀錄')
          return
        }
        var csv = '\ufeff' + rows.map(function(row) {
          return row.map(csvCell).join(',')
        }).join('\r\n')
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' })
        var link = document.createElement('a')
        link.href = URL.createObjectURL(blob)
        link.download = 'lucky-draw-winners.csv'
        document.body.appendChild(link)
        link.click()
        document.body.removeChild(link)
        URL.revokeObjectURL(link.href)
      }

      function currentWinners(data) {
        if (data.winners && data.winners.length) {
          return data.winners
        }
        if (data.list && data.list.length) {
          return data.list.map(function(name) {
            return [name, String(data.level)]
          })
        }
        return []
      }

      function resetAll() {
        if (!confirm('確定重置整個抽獎系統？所有中獎紀錄都會清除。')) {
          return
        }
        if (!originalNames || !originalSteps) {
          alert('原始資料尚未載入')
          return
        }
        names = originalNames.map(function(name) { return name.slice() })
        steps = JSON.parse(JSON.stringify(originalSteps))
        localStorage.removeItem(savedStateKey)
        saveConf()
        step = 0
        state = ''
        reloadConf(nextStep)
      }

      function redrawPrize() {
        if (!steps || !steps[step]) {
          return
        }
        var data = steps[step]
        var winners = currentWinners(data)
        if (!winners.length) {
          return
        }
        if (!confirm('確定重抽本獎？本獎中獎者會放回名單，其他獎項不變。')) {
          return
        }
        for (var i = 0; i < winners.length; ++i) {
          names.push(winners[i].slice())
        }
        updateExportTooltip()
        data.list = []
        data.winners = []
        saveConf()
        state = 'showBlink'
        showBlink(data)
      }

      function showPic(data) {
        disc.innerHTML = data.disc
        image.src = data.image
        image.style.display = 'inline'
        list.style.display = 'none'
        while (list.hasChildNodes()) {
          list.removeChild(list.firstChild)
        }
      }

      function showBlink(data) {
        disc.innerHTML = data.disc
        image.style.display = 'none'
        list.style.display = 'block'
        var spans = []
        for (var i = 0; i < data.count; ++i) {
          var span = document.createElement('span')
          list.appendChild(span)
          spans.push(span)
        }

        function doBlink() {
          if (state == 'showBlink') {
            names.sort(function() {
              return 0.5 - Math.random()
            })
            for (var i = 0; i < data.count; ++i) {
              spans[i].innerHTML = names[i][0]
            }
            window.requestAnimationFrame(doBlink)
          }
        }

        window.requestAnimationFrame(doBlink)
      }

      function showList(data) {
        disc.innerHTML = data.disc
        image.style.display = 'none'
        list.style.display = 'block'
        while (list.hasChildNodes()) {
          list.removeChild(list.firstChild)
        }
        for (var i = 0; i < data.list.length; ++i) {
          var span = document.createElement('span')
          span.innerHTML = data.list[i]
          list.appendChild(span)
        }
      }

      function nextStep() {
        var data = steps[step]
        if (state == 'showPic') {
          data.list = data.list || []
          if (data.list.length > 0) {
            state = 'showList'
            showList(data)
          } else {
            state = 'showBlink'
            showBlink(data)
          }
        } else if (state == 'showBlink') {
          if (data.list.length > 0) {
            state = 'showList'
            showList(data)
          }
        } else if (state == 'showList') {
          if (step < (steps.length - 1)) {
            ++step
            state = ''
            nextStep()
          }
        } else {
          state = 'showPic'
          showPic(data)
        }
      }

      function previousStep() {
        if (step > 0) {
          --step
        }
        state = ''
        nextStep()
      }

      function drawPrize() {
        if (state == 'showBlink') {
          var data = steps[step]
          names.sort(function (a, b) {
            if (a[1] <= data.level && b[1] > data.level) {
              return -1
            }
            return 0
          })
          var luck = names.splice(0, data.count)
          data.winners = luck.map(function(x) {
            return x.slice()
          })
          data.list = luck.map(x => x[0])
          updateExportTooltip()
          saveConf()
          nextStep()
        }
      }

      document.addEventListener('keydown', function(e) {
        e=e||window.event
        var cmd = e.ctrlKey || e.metaKey
        if (cmd && (e.keyCode == 83 || e.key == 's' || e.key == 'S')) {
          e.preventDefault()
          resetAll()
        } else if (cmd && (e.keyCode == 82 || e.key == 'r' || e.key == 'R')) {
          e.preventDefault()
          redrawPrize()
        } else if (e.keyCode == 116) {
          // F5 - reload
          reloadConf()
        } else if (e.keyCode == 39) {
          // Arrow Right - next step
          nextStep()
        } else if (e.keyCode == 37) {
          // Arrow Left - previous step
          previousStep()
        } else if (e.keyCode == 32) {
          // 空格 - draw prize
          drawPrize()
        } else if (e.keyCode == 70) {
          // f - full screen
          if (document.fullscreenElement) {
            document.exitFullscreen()
          } else {
            document.documentElement.requestFullscreen()
          }
        }
      })

      exportButton.addEventListener('click', exportWinners)
      
      try {
        ensureOriginalFiles()
        reloadConf(nextStep)
      } catch (err) {
        alert('Unable to create original configuration files: ' + err.message)
      }
    </script> 
  </body>
</html>
